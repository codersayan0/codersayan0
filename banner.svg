<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Sayan Mandal – AI/ML, Python Full-Stack, Java and Web Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0E7490"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A5F3FC"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#grid)"/>

  <circle cx="1020" cy="60" r="150" fill="url(#glow)">
    <animate attributeName="cx" values="1020;1090;1020" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="230" r="120" fill="url(#glow)">
    <animate attributeName="cy" values="230;180;230" dur="7s" repeatCount="indefinite"/>
  </circle>

  <text x="600" y="118" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#name)" letter-spacing="1">Sayan Mandal</text>

  <text x="600" y="166" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="21" fill="#E0F2FE">AI &amp; ML  •  Python Full-Stack  •  Java  •  Web Developer</text>

  <rect x="470" y="192" width="260" height="2" rx="1" fill="#22D3EE" opacity="0.8">
    <animate attributeName="width" values="40;260;40" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="580;470;580" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="228" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" fill="#BAE6FD" opacity="0.9">B.Tech CSE  |  2023 – 2027</text>
</svg>
